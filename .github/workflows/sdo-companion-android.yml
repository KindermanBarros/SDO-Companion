name: SDO Companion Android release

on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'gradle/**', '.github/workflows/sdo-companion-android.yml']
  pull_request:
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'gradle/**', '.github/workflows/sdo-companion-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SDO_KEYSTORE_BASE64: ${{ secrets.SDO_KEYSTORE_BASE64 }}
      SDO_KEYSTORE_PASSWORD: ${{ secrets.SDO_KEYSTORE_PASSWORD }}
      SDO_KEY_ALIAS: ${{ secrets.SDO_KEY_ALIAS }}
      SDO_KEY_PASSWORD: ${{ secrets.SDO_KEY_PASSWORD }}
      SDO_KEYSTORE_FILE: ${{ github.workspace }}/app/sdo-companion-release.jks
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "$latest_tag" ]]; then
            base="${latest_tag#v}"
            commits="$(git log --format=%s "${latest_tag}..HEAD")"
          else
            base="0.0.0"
            commits="$(git log --format=%s)"
          fi
          IFS=. read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          if grep -Eiq '^release([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((major+=1)); minor=0; patch=0
          elif grep -Eiq '^feat([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((minor+=1)); patch=0
          elif grep -Eiq '^(fix|bugfix)([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((patch+=1))
          else
            echo "No release-worthy commit since ${latest_tag:-the beginning}; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "should_release=true"
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore protected build files
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            GOOGLE_SERVICES_JSON \
            SDO_KEYSTORE_BASE64 \
            SDO_KEYSTORE_PASSWORD \
            SDO_KEY_ALIAS \
            SDO_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing ${secret_name} repository secret."
              exit 1
            fi
          done
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . > /dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          jq -e '.project_info.project_id == "sdo-companion" and
            .client[0].client_info.android_client_info.package_name == "com.kinderman.sdo"' \
            app/google-services.json > /dev/null
          printf '%s' "$SDO_KEYSTORE_BASE64" | base64 --decode > "$SDO_KEYSTORE_FILE"
          chmod 600 "$SDO_KEYSTORE_FILE"

      - name: Build and verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          version_args=()
          if [[ "${{ steps.version.outputs.should_release }}" == "true" ]]; then
            version_args+=(
              "-PreleaseVersion=${{ steps.version.outputs.version }}"
              "-PreleaseCode=${{ steps.version.outputs.version_code }}"
            )
          fi
          gradle clean lintRelease testDebugUnitTest assembleRelease --stacktrace "${version_args[@]}"
          mkdir -p release
          if [[ "${{ steps.version.outputs.should_release }}" == "true" ]]; then
            apk_name="sdo-companion-v${{ steps.version.outputs.version }}.apk"
          else
            apk_name="sdo-companion-release.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "release/$apk_name"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "release/$apk_name"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdo-companion-release-apk
          path: release/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SDO Companion v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*.apk

      - name: Remove protected build files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$SDO_KEYSTORE_FILE"
