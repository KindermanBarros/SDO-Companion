name: SDO Companion Android release

on:
  push:
    branches: [main]
    paths: ['app/**', 'catalogs/**', 'tools/generate_catalog.py', '*.gradle.kts', 'gradle.properties', 'gradle/**', '.github/actions/**', '.github/workflows/sdo-companion-android.yml']
  pull_request:
    paths: ['app/**', 'catalogs/**', 'tools/generate_catalog.py', '*.gradle.kts', 'gradle.properties', 'gradle/**', '.github/actions/**', '.github/workflows/sdo-companion-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate canonical catalog contract
        run: |
          python3 tools/generate_catalog.py --check
          python3 tools/generate_gem_catalog.py --check
          python3 tools/generate_item_catalog.py --check

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      # Pull requests never receive signing/Firebase secrets and do not produce an APK.
      # Packaging is restricted to the trusted main-branch release job below.
      - name: Run debug checks
        run: gradle lintDebug testDebugUnitTest --build-cache --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle connectedDebugAndroidTest --build-cache --stacktrace

  release:
    name: Build and publish Android release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SDO_KEYSTORE_BASE64: ${{ secrets.SDO_KEYSTORE_BASE64 }}
      SDO_KEYSTORE_PASSWORD: ${{ secrets.SDO_KEYSTORE_PASSWORD }}
      SDO_KEY_ALIAS: ${{ secrets.SDO_KEY_ALIAS }}
      SDO_KEY_PASSWORD: ${{ secrets.SDO_KEY_PASSWORD }}
      SDO_KEYSTORE_FILE: ${{ github.workspace }}/app/sdo-companion-release.jks
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate canonical catalog contract
        run: |
          python3 tools/generate_catalog.py --check
          python3 tools/generate_gem_catalog.py --check
          python3 tools/generate_item_catalog.py --check

      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "$latest_tag" ]]; then
            base="${latest_tag#v}"
            commits="$(git log --format=%s "${latest_tag}..HEAD")"
          else
            base="0.0.0"
            commits="$(git log --format=%s)"
          fi
          IFS=. read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          if grep -Eiq '^release([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((major+=1)); minor=0; patch=0
          elif grep -Eiq '^feat([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((minor+=1)); patch=0
          elif grep -Eiq '^(fix|bugfix)([[:space:]]*\([^)]*\))?[[:space:]]*:' <<< "$commits"; then
            ((patch+=1))
          else
            echo "No release-worthy commit since ${latest_tag:-the beginning}; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          {
            echo "should_release=true"
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Restore protected build files
        uses: ./.github/actions/restore-android-secrets

      - name: Build and verify signed release APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_args=()
          if [[ "${{ steps.version.outputs.should_release }}" == "true" ]]; then
            version_args+=(
              "-PreleaseVersion=${{ steps.version.outputs.version }}"
              "-PreleaseCode=${{ steps.version.outputs.version_code }}"
            )
          fi
          gradle assembleRelease --build-cache --stacktrace "${version_args[@]}"
          mkdir -p release
          if [[ "${{ steps.version.outputs.should_release }}" == "true" ]]; then
            apk_name="sdo-companion-v${{ steps.version.outputs.version }}.apk"
          else
            apk_name="sdo-companion-release.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "release/$apk_name"
          echo "apk_path=release/$apk_name" >> "$GITHUB_OUTPUT"

      - name: Verify release APK certificate
        uses: ./.github/actions/verify-android-signature
        with:
          apk: ${{ steps.package.outputs.apk_path }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdo-companion-release-apk
          path: release/*.apk

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SDO Companion v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*.apk

      - name: Remove protected build files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$SDO_KEYSTORE_FILE"
