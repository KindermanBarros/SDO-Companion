name: SDO Companion Android CI
on:
  push:
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/sdo-companion-android.yml']
  pull_request:
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/sdo-companion-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SDO_KEYSTORE_BASE64: ${{ secrets.SDO_KEYSTORE_BASE64 }}
      SDO_KEYSTORE_PASSWORD: ${{ secrets.SDO_KEYSTORE_PASSWORD }}
      SDO_KEY_ALIAS: ${{ secrets.SDO_KEY_ALIAS }}
      SDO_KEY_PASSWORD: ${{ secrets.SDO_KEY_PASSWORD }}
      SDO_KEYSTORE_FILE: ${{ github.workspace }}/app/sdo-companion-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase config
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        shell: bash
        run: |
          if [[ "$GOOGLE_SERVICES_JSON" == \{* ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          jq -e '.project_info.project_id == "sdo-companion" and
            .client[0].client_info.android_client_info.package_name == "com.kinderman.sdo"' \
            app/google-services.json > /dev/null
      - name: Restore signing keystore
        shell: bash
        run: |
          test -n "$SDO_KEYSTORE_BASE64"
          test -n "$SDO_KEYSTORE_PASSWORD"
          test -n "$SDO_KEY_ALIAS"
          test -n "$SDO_KEY_PASSWORD"
          printf '%s' "$SDO_KEYSTORE_BASE64" | base64 --decode > "$SDO_KEYSTORE_FILE"
      - run: gradle lintRelease testDebugUnitTest assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sdo-companion-release-apk
          path: app/build/outputs/apk/release/app-release.apk
