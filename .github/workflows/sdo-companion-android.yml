name: SDO Companion Android CI
on:
  push:
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/sdo-companion-android.yml']
  pull_request:
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/sdo-companion-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase config
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        shell: bash
        run: |
          if [[ "$GOOGLE_SERVICES_JSON" == \{* ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          jq -e '.project_info.project_id and .client[0].client_info.android_client_info.package_name' \
            app/google-services.json > /dev/null
      - run: gradle lintDebug testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sdo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
