name: Adaptive UI runtime

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-ui.yml'
      - '.github/scripts/run-adaptive-ui-tests.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-components:
    name: Adaptive components on Android tablet
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify adaptive policy tests
        run: ./gradlew :app:testDebugUnitTest --tests com.kinderman.sdo.ui.AdaptiveLayoutPolicyTest --stacktrace
      - name: Run adaptive component tests and capture layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-adaptive-ui-tests.sh
      - name: Upload test results and layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-ui-results
          path: |
            app/build/reports/adaptive-ui/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
