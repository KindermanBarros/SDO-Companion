name: Fix debug APK

on:
  push:

permissions:
  contents: read

concurrency:
  group: fix-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK for fix commit
    if: startsWith(github.event.head_commit.message, 'fix:') || startsWith(github.event.head_commit.message, 'fix(')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle assembleDebug --build-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sdo-companion-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record build
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo '### Debug APK generated'
            echo
            echo '- Commit: `${{ github.sha }}`'
            printf -- '- Message: `%s`\n' "$COMMIT_MESSAGE"
            echo '- Artifact: `sdo-companion-debug-${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
