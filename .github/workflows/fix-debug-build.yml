name: Authenticated debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fix-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-authenticated-debug:
    name: Build authenticated debug APK
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      SDO_KEYSTORE_BASE64: ${{ secrets.SDO_KEYSTORE_BASE64 }}
      SDO_KEYSTORE_PASSWORD: ${{ secrets.SDO_KEYSTORE_PASSWORD }}
      SDO_KEY_ALIAS: ${{ secrets.SDO_KEY_ALIAS }}
      SDO_KEY_PASSWORD: ${{ secrets.SDO_KEY_PASSWORD }}
      SDO_KEYSTORE_FILE: ${{ github.workspace }}/app/sdo-companion-release.jks
    steps:
      - name: Checkout repository push or manually selected commit
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Restore protected build files
        uses: ./.github/actions/restore-android-secrets
      - name: Build authenticated debug APK
        run: ./gradlew :app:assembleDebug --build-cache --stacktrace
      - name: Verify debug APK certificate
        uses: ./.github/actions/verify-android-signature
        with:
          apk: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload authenticated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sdo-companion-authenticated-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Record authenticated build
        run: echo 'Authenticated debug APK generated with the registered Firebase configuration and certificate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove protected build files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$SDO_KEYSTORE_FILE"
