name: Firebase security rules

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package.json

      - name: Install Firebase test dependencies
        run: npm install --prefix firebase --no-audit --no-fund

      - name: Test Firestore rules in emulator
        run: npm --prefix firebase run test:rules
