name: Firebase rules deploy

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or commit SHA to deploy (use an older tag/SHA to roll back)'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: sdo-companion
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  validate:
    name: Validate Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected version
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package.json

      - name: Install Firebase test dependencies
        run: npm install --prefix firebase --no-audit --no-fund

      - name: Test Firestore rules in emulator
        run: npm --prefix firebase run test:rules

      - name: Archive validated Firebase configuration
        uses: actions/upload-artifact@v4
        with:
          name: firebase-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firebase.json
            firebase/firestore.rules
            firebase/firestore.indexes.json
          retention-days: 90

  deploy:
    name: Deploy Firestore production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout validated version
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package.json

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SDO_COMPANION || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Install Firebase CLI
        run: npm install --prefix firebase --no-audit --no-fund

      - name: Deploy rules and indexes
        run: >-
          firebase/node_modules/.bin/firebase deploy
          --config firebase.json
          --project "$FIREBASE_PROJECT_ID"
          --only firestore:rules,firestore:indexes
          --non-interactive

      - name: Record deployment
        shell: bash
        run: |
          {
            echo '### Firebase production deployment'
            echo
            echo "- Project: \`$FIREBASE_PROJECT_ID\`"
            echo "- Source ref: \`$DEPLOY_REF\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
