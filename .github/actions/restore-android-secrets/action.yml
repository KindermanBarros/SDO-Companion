name: Restore Android protected files
description: Validate and restore the Firebase configuration and signing keystore for prod or dev
inputs:
  env:
    description: Target environment ('prod' or 'dev')
    required: false
    default: prod
runs:
  using: composite
  steps:
    - name: Validate and restore files
      shell: bash
      run: |
        set -euo pipefail
        TARGET_ENV="${{ inputs.env }}"
        if [[ "$TARGET_ENV" == "dev" ]]; then
          GS_PAYLOAD="${GOOGLE_SERVICES_JSON_DEV:-}"
          GS_SECRET_NAME="GOOGLE_SERVICES_JSON_DEV"
          GS_DEST="app/src/dev/google-services.json"
          EXPECTED_PKG="com.kinderman.sdo.dev"
        else
          GS_PAYLOAD="${GOOGLE_SERVICES_JSON:-}"
          GS_SECRET_NAME="GOOGLE_SERVICES_JSON"
          GS_DEST="app/src/prod/google-services.json"
          EXPECTED_PKG="com.kinderman.sdo"
        fi

        if [[ -z "$GS_PAYLOAD" ]]; then
          echo "::error::Missing ${GS_SECRET_NAME} repository secret."
          exit 1
        fi
        for secret_name in \
          SDO_KEYSTORE_BASE64 \
          SDO_KEYSTORE_PASSWORD \
          SDO_KEY_ALIAS \
          SDO_KEY_PASSWORD
        do
          if [[ -z "${!secret_name:-}" ]]; then
            echo "::error::Missing ${secret_name} repository secret."
            exit 1
          fi
        done

        mkdir -p "$(dirname "$GS_DEST")"
        if printf '%s' "$GS_PAYLOAD" | jq -e . > /dev/null 2>&1; then
          printf '%s' "$GS_PAYLOAD" > "$GS_DEST"
        else
          printf '%s' "$GS_PAYLOAD" | base64 --decode > "$GS_DEST"
        fi

        if [[ "$TARGET_ENV" == "prod" ]]; then
          jq -e '.project_info.project_id == "sdo-companion" and
            .client[0].client_info.android_client_info.package_name == "com.kinderman.sdo"' \
            "$GS_DEST" > /dev/null
        else
          jq -e --arg pkg "$EXPECTED_PKG" \
            '.client | any(.client_info.android_client_info.package_name == $pkg)' \
            "$GS_DEST" > /dev/null
        fi

        printf '%s' "$SDO_KEYSTORE_BASE64" | base64 --decode > "$SDO_KEYSTORE_FILE"
        chmod 600 "$SDO_KEYSTORE_FILE"
